<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoDown</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:   #6C63FF;
      --accent-dk:#4F46E5;
      --green:    #1D9E75;
      --red:      #E24B4A;
      --bg:       #0A0A0F;
      --bg2:      #13131A;
      --bg3:      #1C1C26;
      --bg4:      #242430;
      --border:   rgba(255,255,255,0.07);
      --border2:  rgba(255,255,255,0.12);
      --text:     #F0EEF8;
      --text2:    #9896A8;
      --text3:    #55536A;
      --font:     'DM Sans', sans-serif;
      --mono:     'DM Mono', monospace;
      --radius:   16px;
      --radius-sm:10px;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem 5rem;
    }

    /* ── HEADER ── */
    .header { text-align: center; margin-bottom: 2.5rem; }
    .logo {
      width: 64px; height: 64px; border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), #A855F7);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; margin: 0 auto 1rem;
      box-shadow: 0 8px 32px rgba(108,99,255,0.3);
    }
    .header h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
    .header h1 span { color: var(--accent); }
    .header p  { font-size: 14px; color: var(--text3); margin-top: 6px; }

    /* ── MAIN CARD ── */
    .card {
      width: 100%; max-width: 580px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.75rem;
    }

    /* ── INPUT URL ── */
    .input-wrap {
      display: flex; gap: 8px; margin-bottom: 1.25rem;
    }
    .url-input {
      flex: 1; background: var(--bg3); border: 1px solid var(--border2);
      border-radius: var(--radius-sm); padding: 12px 14px;
      font-size: 14px; color: var(--text); font-family: var(--font);
      outline: none; transition: border-color 0.15s;
    }
    .url-input:focus { border-color: var(--accent); }
    .url-input::placeholder { color: var(--text3); }

    .btn-buscar {
      background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius-sm); padding: 12px 20px;
      font-size: 14px; font-weight: 500; font-family: var(--font);
      cursor: pointer; transition: background 0.15s, transform 0.1s;
      white-space: nowrap; display: flex; align-items: center; gap: 6px;
    }
    .btn-buscar:hover   { background: var(--accent-dk); }
    .btn-buscar:active  { transform: scale(0.97); }
    .btn-buscar:disabled{ opacity: 0.5; cursor: not-allowed; }

    /* ── SITIOS SOPORTADOS ── */
    .sites {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.5rem;
    }
    .site-chip {
      font-size: 11px; padding: 3px 10px; border-radius: 20px;
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text3);
    }

    /* ── VIDEO INFO ── */
    .video-info {
      display: none; margin-bottom: 1.5rem;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--radius-sm); overflow: hidden;
    }
    .video-info.visible { display: flex; gap: 14px; padding: 14px; }
    .video-thumb {
      width: 120px; height: 68px; object-fit: cover;
      border-radius: 8px; flex-shrink: 0; background: var(--bg4);
    }
    .video-meta { flex: 1; min-width: 0; }
    .video-title {
      font-size: 14px; font-weight: 500; color: var(--text);
      overflow: hidden; text-overflow: ellipsis;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      margin-bottom: 5px;
    }
    .video-uploader { font-size: 12px; color: var(--text3); }
    .video-duration {
      font-family: var(--mono); font-size: 11px; color: var(--text3);
      margin-top: 4px;
    }

    /* ── FORMATOS ── */
    .formatos-label {
      font-size: 12px; color: var(--text3); text-transform: uppercase;
      letter-spacing: 0.06em; margin-bottom: 8px;
    }
    .formatos-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px; margin-bottom: 1.5rem;
    }
    .formato-btn {
      background: var(--bg3); border: 1px solid var(--border2);
      border-radius: var(--radius-sm); padding: 10px 8px;
      text-align: center; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .formato-btn:hover { border-color: var(--accent); background: rgba(108,99,255,0.06); }
    .formato-btn.sel   { border-color: var(--accent); background: rgba(108,99,255,0.1); }
    .formato-btn.audio { border-color: rgba(29,158,117,0.4); }
    .formato-btn.audio.sel { background: rgba(29,158,117,0.1); border-color: var(--green); }
    .formato-quality { font-size: 15px; font-weight: 600; color: var(--text); }
    .formato-ext     { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .formato-size    { font-family: var(--mono); font-size: 10px; color: var(--text3); margin-top: 3px; }

    /* ── BTN DESCARGAR ── */
    .btn-descargar {
      width: 100%; background: linear-gradient(135deg, var(--accent), #A855F7);
      color: #fff; border: none; border-radius: var(--radius-sm);
      padding: 13px; font-size: 15px; font-weight: 600; font-family: var(--font);
      cursor: pointer; transition: opacity 0.15s, transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-descargar:hover   { opacity: 0.9; }
    .btn-descargar:active  { transform: scale(0.99); }
    .btn-descargar:disabled{ opacity: 0.4; cursor: not-allowed; }

    /* ── PROGRESS ── */
    .progress-wrap {
      display: none; margin-top: 1.25rem;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 14px 16px;
    }
    .progress-wrap.visible { display: block; }
    .progress-label { font-size: 13px; color: var(--text2); margin-bottom: 8px; display: flex; justify-content: space-between; }
    .progress-bar-bg { background: var(--bg4); border-radius: 10px; height: 6px; overflow: hidden; }
    .progress-bar    { height: 100%; background: linear-gradient(90deg, var(--accent), #A855F7); border-radius: 10px; width: 0%; transition: width 0.3s ease; }

    /* ── SUCCESS ── */
    .success-msg {
      display: none; margin-top: 1.25rem;
      background: rgba(29,158,117,0.08); border: 1px solid rgba(29,158,117,0.3);
      border-radius: var(--radius-sm); padding: 14px 16px;
      font-size: 13px; color: var(--green);
    }
    .success-msg.visible { display: flex; align-items: center; gap: 10px; }
    .success-msg strong  { display: block; font-size: 14px; margin-bottom: 2px; }

    /* ── ERROR ── */
    .error-msg {
      display: none; margin-top: 1rem;
      background: rgba(226,75,74,0.08); border: 1px solid rgba(226,75,74,0.25);
      border-radius: var(--radius-sm); padding: 12px 14px;
      font-size: 13px; color: var(--red);
    }
    .error-msg.visible { display: block; }

    /* ── FOOTER ── */
    .footer { margin-top: 2rem; font-size: 12px; color: var(--text3); text-align: center; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">🎬</div>
  <h1>Video<span>Down</span></h1>
  <p>Descarga videos sin anuncios — uso personal</p>
</div>

<div class="card">

  <!-- INPUT -->
  <div class="input-wrap">
    <input type="text" class="url-input" id="url-input"
      placeholder="Pega el link del video aquí..."
      onkeydown="if(event.key==='Enter') buscarInfo()"/>
    <button class="btn-buscar" id="btn-buscar" onclick="buscarInfo()">
      🔍 Buscar
    </button>
  </div>

  <!-- SITIOS -->
  <div class="sites">
    <span class="site-chip">▶️ YouTube</span>
    <span class="site-chip">📸 Instagram</span>
    <span class="site-chip">🎵 TikTok</span>
    <span class="site-chip">🐦 Twitter/X</span>
    <span class="site-chip">📘 Facebook</span>
    <span class="site-chip">🔴 Twitch</span>
    <span class="site-chip">+ 1000 sitios más</span>
  </div>

  <!-- VIDEO INFO -->
  <div class="video-info" id="video-info">
    <img class="video-thumb" id="video-thumb" src="" alt="thumbnail"/>
    <div class="video-meta">
      <div class="video-title"    id="video-title"></div>
      <div class="video-uploader" id="video-uploader"></div>
      <div class="video-duration" id="video-duration"></div>
    </div>
  </div>

  <!-- FORMATOS -->
  <div id="formatos-section" style="display:none">
    <div class="formatos-label">Elige la calidad</div>
    <div class="formatos-grid" id="formatos-grid"></div>
    <button class="btn-descargar" id="btn-descargar" onclick="descargar()" disabled>
      ⬇️ Descargar
    </button>
  </div>

  <!-- PROGRESO -->
  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-label">
      <span id="progress-text">Descargando...</span>
      <span id="progress-pct"></span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <!-- ÉXITO -->
  <div class="success-msg" id="success-msg">
    <span style="font-size:24px">✅</span>
    <div>
      <strong>¡Descarga completa!</strong>
      <span id="success-detail"></span>
    </div>
  </div>

  <!-- ERROR -->
  <div class="error-msg" id="error-msg"></div>

</div>

<div class="footer">Solo para uso personal · VideoDown corre localmente en tu PC</div>

<script>
let selFormatoId  = null;
let currentUrl    = null;
let currentTitulo = null;

/* ── BUSCAR INFO ── */
async function buscarInfo() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) return;

  currentUrl = url;
  resetUI();
  setBuscarLoading(true);
  showError('');

  try {
    const res  = await fetch('/info', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await res.json();

    if (data.error) { showError(data.error); setBuscarLoading(false); return; }

    currentTitulo = data.title;

    // Mostrar info
    document.getElementById('video-thumb').src        = data.thumbnail;
    document.getElementById('video-title').textContent = data.title;
    document.getElementById('video-uploader').textContent = data.uploader;
    document.getElementById('video-duration').textContent = formatDuration(data.duration);
    document.getElementById('video-info').classList.add('visible');

    // Mostrar formatos
    const grid = document.getElementById('formatos-grid');
    grid.innerHTML = '';
    data.formatos.forEach(f => {
      const btn = document.createElement('div');
      const esAudio = f.format_id === 'bestaudio';
      btn.className = 'formato-btn' + (esAudio ? ' audio' : '');
      btn.innerHTML = `
        <div class="formato-quality">${esAudio ? '🎵' : f.label}</div>
        <div class="formato-ext">${f.ext.toUpperCase()}</div>
        ${f.filesize ? `<div class="formato-size">${formatSize(f.filesize)}</div>` : ''}
      `;
      btn.onclick = () => selFormato(f.format_id, btn);
      grid.appendChild(btn);
    });

    document.getElementById('formatos-section').style.display = 'block';

  } catch(e) {
    showError('Error de conexión con el servidor');
  }

  setBuscarLoading(false);
}

/* ── SELECCIONAR FORMATO ── */
function selFormato(id, el) {
  selFormatoId = id;
  document.querySelectorAll('.formato-btn').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('btn-descargar').disabled = false;
}

/* ── DESCARGAR ── */
async function descargar() {
  if (!selFormatoId || !currentUrl) return;

  document.getElementById('btn-descargar').disabled = true;
  document.getElementById('success-msg').classList.remove('visible');
  showError('');

  // Mostrar progreso animado (simulado — yt-dlp no tiene progreso en tiempo real fácil)
  const progressWrap = document.getElementById('progress-wrap');
  const progressBar  = document.getElementById('progress-bar');
  const progressText = document.getElementById('progress-text');
  progressWrap.classList.add('visible');
  progressText.textContent = 'Descargando... esto puede tomar unos segundos';

  let pct = 0;
  const interval = setInterval(() => {
    pct = Math.min(pct + Math.random() * 8, 90);
    progressBar.style.width = pct + '%';
    document.getElementById('progress-pct').textContent = Math.round(pct) + '%';
  }, 400);

  try {
    const res  = await fetch('/download', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: currentUrl, format_id: selFormatoId, titulo: currentTitulo })
    });
    const data = await res.json();

    clearInterval(interval);
    progressBar.style.width = '100%';
    document.getElementById('progress-pct').textContent = '100%';

    setTimeout(() => {
      progressWrap.classList.remove('visible');
      if (data.error) {
        showError(data.error);
        document.getElementById('btn-descargar').disabled = false;
      } else {
        const msg = document.getElementById('success-msg');
        document.getElementById('success-detail').textContent =
          `Guardado en: ${data.folder}\\${data.filename}`;
        msg.classList.add('visible');
        document.getElementById('btn-descargar').disabled = false;
      }
    }, 500);

  } catch(e) {
    clearInterval(interval);
    progressWrap.classList.remove('visible');
    showError('Error de conexión con el servidor');
    document.getElementById('btn-descargar').disabled = false;
  }
}

/* ── UTILS ── */
function resetUI() {
  selFormatoId = null;
  document.getElementById('video-info').classList.remove('visible');
  document.getElementById('formatos-section').style.display = 'none';
  document.getElementById('success-msg').classList.remove('visible');
  document.getElementById('progress-wrap').classList.remove('visible');
  document.getElementById('btn-descargar').disabled = true;
}

function setBuscarLoading(loading) {
  const btn = document.getElementById('btn-buscar');
  btn.disabled    = loading;
  btn.textContent = loading ? '⏳ Buscando...' : '🔍 Buscar';
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.className   = 'error-msg' + (msg ? ' visible' : '');
}

function formatDuration(secs) {
  if (!secs) return '';
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${m}:${String(s).padStart(2,'0')}`;
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes > 1e9) return (bytes/1e9).toFixed(1) + ' GB';
  if (bytes > 1e6) return (bytes/1e6).toFixed(0) + ' MB';
  return (bytes/1e3).toFixed(0) + ' KB';
}
</script>
</body>
</html>
